kind = "web"
previewPath = "/"
title = "VIBES"
version = "1.0.0"
id = "artifacts/vibes"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23426

[services.development]
run = "pnpm --filter @workspace/vibes run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vibes", "run", "build" ]
publicDir = "artifacts/vibes/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23426"
BASE_PATH = "/"
